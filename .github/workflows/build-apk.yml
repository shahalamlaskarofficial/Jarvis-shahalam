name: Build JARVIS Android APK (shahalam laskar)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Android SDK Build Tools 34
        run: |
          yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Generate Native Android Assistant Project & Compile APK
        run: |
          BUILD_TOOLS="${ANDROID_HOME}/build-tools/34.0.0"
          PLATFORM="${ANDROID_HOME}/platforms/android-34/android.jar"

          mkdir -p build/gen build/obj build/apk
          mkdir -p src/com/shahalamlaskar/jarvis
          mkdir -p res/xml res/values assets

          cp index.html assets/index.html

          cat << 'EOF' > res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">J.A.R.V.I.S.</string>
              <string name="dev_name">shahalam laskar</string>
          </resources>
          EOF

          cat << 'EOF' > res/xml/device_admin.xml
          <?xml version="1.0" encoding="utf-8"?>
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies>
                  <force-lock />
              </uses-policies>
          </device-admin>
          EOF

          cat << 'EOF' > AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.shahalamlaskar.jarvis"
              android:versionCode="1"
              android:versionName="1.0-shahalam-laskar">

              <uses-sdk android:minSdkVersion="24" android:targetSdkVersion="34" />
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <application
                  android:label="@string/app_name"
                  android:hardwareAccelerated="true"
                  android:usesCleartextTraffic="true"
                  android:theme="@android:style/Theme.Black.NoTitleBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTask"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <!-- Register as Android Default Digital Assistant -->
                      <intent-filter>
                          <action android:name="android.intent.action.ASSIST" />
                          <action android:name="android.intent.action.VOICE_COMMAND" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>

                  <!-- Native Hardware Screen Lock Admin Receiver ("Jarvis Lock") -->
                  <receiver
                      android:name=".LockAdminReceiver"
                      android:permission="android.permission.BIND_DEVICE_ADMIN"
                      android:exported="true">
                      <meta-data
                          android:name="android.app.device_admin"
                          android:resource="@xml/device_admin" />
                      <intent-filter>
                          <action android:name="android.app.action.DEVICE_ADMIN_ENABLED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > src/com/shahalamlaskar/jarvis/LockAdminReceiver.java
          package com.shahalamlaskar.jarvis;
          import android.app.admin.DeviceAdminReceiver;
          public class LockAdminReceiver extends DeviceAdminReceiver {}
          EOF

          cat << 'EOF' > src/com/shahalamlaskar/jarvis/MainActivity.java
          package com.shahalamlaskar.jarvis;

          import android.Manifest;
          import android.app.Activity;
          import android.app.admin.DevicePolicyManager;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.speech.RecognizerIntent;
          import android.speech.tts.TextToSpeech;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import org.json.JSONObject;
          import java.util.ArrayList;
          import java.util.Locale;

          public class MainActivity extends Activity implements TextToSpeech.OnInitListener {
              private WebView webView;
              private TextToSpeech tts;
              private DevicePolicyManager dpm;
              private ComponentName adminComp;
              private static final int REQ_SPEECH = 101;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  dpm = (DevicePolicyManager) getSystemService(Context.DEVICE_POLICY_SERVICE);
                  adminComp = new ComponentName(this, LockAdminReceiver.class);
                  tts = new TextToSpeech(this, this);

                  if (Build.VERSION.SDK_INT >= 23) {
                      if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          requestPermissions(new String[]{Manifest.permission.RECORD_AUDIO}, 1);
                      }
                  }

                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setMediaPlaybackRequiresUserGesture(false);

                  webView.setWebViewClient(new WebViewClient());
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          runOnUiThread(() -> request.grant(request.getResources()));
                      }
                  });

                  webView.addJavascriptInterface(new JarvisBridge(), "AndroidJarvis");
                  setContentView(webView);
                  webView.loadUrl("file:///android_asset/index.html");
              }

              @Override
              public void onInit(int status) {
                  if (status == TextToSpeech.SUCCESS) {
                      tts.setLanguage(Locale.UK);
                      tts.setPitch(0.84f);
                      tts.setSpeechRate(1.05f);
                  }
              }

              public class JarvisBridge {
                  @JavascriptInterface
                  public void speak(String text, String langTag) {
                      if (tts == null) return;
                      if (langTag != null && langTag.startsWith("hi")) {
                          tts.setLanguage(new Locale("hi", "IN"));
                          tts.setPitch(0.92f);
                      } else if (langTag != null && langTag.startsWith("bn")) {
                          tts.setLanguage(new Locale("bn", "IN"));
                          tts.setPitch(0.92f);
                      } else {
                          tts.setLanguage(Locale.UK);
                          tts.setPitch(0.84f);
                      }
                      tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "jarvis_utt");
                  }

                  @JavascriptInterface
                  public void lockPhone() {
                      if (dpm != null && dpm.isAdminActive(adminComp)) {
                          dpm.lockNow();
                      } else {
                          requestAdmin();
                      }
                  }

                  @JavascriptInterface
                  public void requestAdmin() {
                      Intent intent = new Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN);
                      intent.putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, adminComp);
                      intent.putExtra(DevicePolicyManager.EXTRA_ADD_EXPLANATION, "Allow J.A.R.V.I.S. (shahalam laskar) to lock screen on command.");
                      startActivity(intent);
                  }

                  @JavascriptInterface
                  public void openUri(String uriStr) {
                      try {
                          Intent intent;
                          if (uriStr.startsWith("intent:")) {
                              intent = Intent.parseUri(uriStr, Intent.URI_INTENT_SCHEME);
                          } else {
                              intent = new Intent(Intent.ACTION_VIEW, Uri.parse(uriStr));
                          }
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(intent);
                      } catch (Exception e) {
                          Intent webFallback = new Intent(Intent.ACTION_VIEW, Uri.parse("https://www.google.com"));
                          startActivity(webFallback);
                      }
                  }

                  @JavascriptInterface
                  public void startListening(String lang) {
                      runOnUiThread(() -> {
                          try {
                              Intent i = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                              i.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                              i.putExtra(RecognizerIntent.EXTRA_LANGUAGE, lang);
                              startActivityForResult(i, REQ_SPEECH);
                          } catch (Exception ignored) {}
                      });
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_SPEECH && resultCode == RESULT_OK && data != null) {
                      ArrayList<String> res = data.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS);
                      if (res != null && !res.isEmpty()) {
                          String spoken = JSONObject.quote(res.get(0));
                          webView.evaluateJavascript("window.onNativeSpeechResult(" + spoken + ");", null);
                      }
                  }
              }

              // Zero Background Drain Lifecycle
              @Override
              protected void onPause() {
                  super.onPause();
                  if (webView != null) {
                      webView.onPause();
                      webView.pauseTimers();
                  }
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  if (webView != null) {
                      webView.onResume();
                      webView.resumeTimers();
                  }
              }

              @Override
              protected void onDestroy() {
                  if (tts != null) {
                      tts.stop();
                      tts.shutdown();
                  }
                  super.onDestroy();
              }
          }
          EOF

          # 1. Compile and link resources + assets/index.html
          ${BUILD_TOOLS}/aapt2 compile --dir res -o build/resources.zip
          ${BUILD_TOOLS}/aapt2 link \
            -I "${PLATFORM}" \
            --manifest AndroidManifest.xml \
            -A assets \
            -o build/apk/jarvis-unaligned.apk \
            --java build/gen \
            build/resources.zip

          # 2. Compile Java sources
          javac -source 11 -target 11 -cp "${PLATFORM}" -d build/obj \
            build/gen/com/shahalamlaskar/jarvis/R.java \
            src/com/shahalamlaskar/jarvis/LockAdminReceiver.java \
            src/com/shahalamlaskar/jarvis/MainActivity.java

          # 3. Convert .class files to DEX bytecode
          ${BUILD_TOOLS}/d8 --lib "${PLATFORM}" --output build/apk/ build/obj/com/shahalamlaskar/jarvis/*.class

          # 4. Package classes.dex into APK, zipalign, and sign
          cd build/apk
          zip -j jarvis-unaligned.apk classes.dex
          ${BUILD_TOOLS}/zipalign -p -f 4 jarvis-unaligned.apk jarvis-aligned.apk

          keytool -genkeypair -v -keystore jarvis.keystore -alias shahalam \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 23112009 -keypass 23112009 \
            -dname "CN=shahalam laskar, OU=AI, O=shahalam laskar, L=Assam, S=Assam, C=IN"

          ${BUILD_TOOLS}/apksigner sign --ks jarvis.keystore \
            --ks-pass pass:23112009 --key-pass pass:23112009 \
            --out JARVIS-shahalam-laskar.apk jarvis-aligned.apk

      - name: Upload APK to Actions Tab
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-shahalam-laskar-APK
          path: build/apk/JARVIS-shahalam-laskar.apk

      - name: Publish Direct APK Download to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0-jarvis
          name: "J.A.R.V.I.S. Android APK (by shahalam laskar)"
          files: build/apk/JARVIS-shahalam-laskar.apk
