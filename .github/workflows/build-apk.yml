name: Build Jarvis Android APK (Shahalam Laskar)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Assemble Native Jarvis v3.0 Android Project
        run: |
          mkdir -p build_apk/src/com/shahalam/jarvis
          mkdir -p build_apk/res/values
          mkdir -p build_apk/res/xml
          mkdir -p build_apk/res/drawable
          mkdir -p build_apk/assets
          mkdir -p build_apk/obj

          cp index.html build_apk/assets/index.html

          # Generate a fixed custom Jarvis Launcher Icon PNG automatically
          python3 - << 'PYEOF'
          import zlib, struct, math
          w, h = 192, 192
          raw = bytearray()
          for y in range(h):
              raw.append(0)
              for x in range(w):
                  dx, dy = x - 96, y - 96
                  dist = math.hypot(dx, dy)
                  if dist > 90:
                      raw.extend((0, 0, 0, 0))
                  elif 74 <= dist <= 82 or 52 <= dist <= 56 or dist <= 26:
                      raw.extend((0, 240, 255, 255))
                  else:
                      raw.extend((4, 14, 30, 255))
          def chunk(t, d):
              return struct.pack(">I", len(d)) + t + d + struct.pack(">I", zlib.crc32(t + d) & 0xffffffff)
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0)) + chunk(b"IDAT", zlib.compress(bytes(raw), 9)) + chunk(b"IEND", b"")
          with open("build_apk/res/drawable/ic_launcher.png", "wb") as f:
              f.write(png)
          PYEOF

          cat << 'EOF' > build_apk/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Jarvis</string>
          </resources>
          EOF

          cat << 'EOF' > build_apk/res/xml/device_admin.xml
          <?xml version="1.0" encoding="utf-8"?>
          <device-admin xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-policies>
                  <force-lock />
              </uses-policies>
          </device-admin>
          EOF

          cat << 'EOF' > build_apk/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.shahalam.jarvis"
              android:versionCode="3"
              android:versionName="3.0">

              <uses-sdk android:minSdkVersion="23" android:targetSdkVersion="33" />

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.CALL_PHONE" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.FLASHLIGHT" />
              <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" />
              <uses-permission android:name="com.android.alarm.permission.SET_ALARM" />

              <application
                  android:label="@string/app_name"
                  android:icon="@drawable/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.ASSIST" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>

                  <receiver
                      android:name=".JarvisAdminReceiver"
                      android:permission="android.permission.BIND_DEVICE_ADMIN"
                      android:exported="true">
                      <meta-data
                          android:name="android.app.device_admin"
                          android:resource="@xml/device_admin" />
                      <intent-filter>
                          <action android:name="android.app.action.DEVICE_ADMIN_ENABLED" />
                      </intent-filter>
                  </receiver>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > build_apk/src/com/shahalam/jarvis/JarvisAdminReceiver.java
          package com.shahalam.jarvis;
          import android.app.admin.DeviceAdminReceiver;
          public class JarvisAdminReceiver extends DeviceAdminReceiver {}
          EOF

          cat << 'EOF' > build_apk/src/com/shahalam/jarvis/MainActivity.java
          package com.shahalam.jarvis;

          import android.Manifest;
          import android.app.Activity;
          import android.app.admin.DevicePolicyManager;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.content.pm.ResolveInfo;
          import android.hardware.camera2.CameraManager;
          import android.media.AudioManager;
          import android.net.Uri;
          import android.os.Bundle;
          import android.provider.AlarmClock;
          import android.provider.Settings;
          import android.speech.RecognizerIntent;
          import android.speech.tts.TextToSpeech;
          import android.webkit.JavascriptInterface;
          import android.webkit.PermissionRequest;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import org.json.JSONObject;
          import java.util.ArrayList;
          import java.util.List;
          import java.util.Locale;

          public class MainActivity extends Activity {
              private WebView webView;
              private TextToSpeech tts;
              private static final int REQ_SPEECH = 1001;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  setContentView(webView);

                  requestPermissions(new String[]{
                      Manifest.permission.RECORD_AUDIO,
                      Manifest.permission.CALL_PHONE
                  }, 100);

                  tts = new TextToSpeech(this, status -> {
                      if (status == TextToSpeech.SUCCESS) {
                          tts.setLanguage(Locale.UK);
                          tts.setPitch(0.88f);
                          tts.setSpeechRate(1.02f);
                      }
                  });

                  WebSettings ws = webView.getSettings();
                  ws.setJavaScriptEnabled(true);
                  ws.setDomStorageEnabled(true);
                  ws.setMediaPlaybackRequiresUserGesture(false);
                  ws.setAllowFileAccess(true);
                  ws.setCacheMode(WebSettings.LOAD_DEFAULT);

                  webView.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, String url) {
                          if (url.startsWith("mailto:") || url.startsWith("tel:") || url.startsWith("https://wa.me")) {
                              try {
                                  startActivity(new Intent(Intent.ACTION_VIEW, Uri.parse(url)));
                              } catch (Exception ignored) {}
                              return true;
                          }
                          return false;
                      }
                  });
                  webView.setWebChromeClient(new WebChromeClient() {
                      @Override
                      public void onPermissionRequest(final PermissionRequest request) {
                          request.grant(request.getResources());
                      }
                  });

                  webView.addJavascriptInterface(new NativeBridge(), "NativeJarvis");
                  webView.loadUrl("file:///android_asset/index.html");
              }

              public class NativeBridge {
                  @JavascriptInterface
                  public void startVoice(String lang) {
                      runOnUiThread(() -> {
                          try {
                              Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                              intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                              intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, lang != null ? lang : "en-IN");
                              intent.putExtra(RecognizerIntent.EXTRA_PROMPT, "Speak to Jarvis...");
                              startActivityForResult(intent, REQ_SPEECH);
                          } catch (Exception e) {
                              webView.evaluateJavascript("window.onNativeSpeechResult('');", null);
                          }
                      });
                  }

                  @JavascriptInterface
                  public void speak(String text, String lang) {
                      if (tts != null) {
                          if (lang != null && lang.startsWith("hi")) {
                              tts.setLanguage(new Locale("hi", "IN"));
                          } else if (lang != null && lang.startsWith("bn")) {
                              tts.setLanguage(new Locale("bn", "IN"));
                          } else {
                              tts.setLanguage(Locale.UK);
                          }
                          tts.speak(text, TextToSpeech.QUEUE_FLUSH, null, "jarvis_utt");
                      }
                  }

                  @JavascriptInterface
                  public void directCall(String number) {
                      runOnUiThread(() -> {
                          try {
                              Uri uri = Uri.parse("tel:" + Uri.encode(number));
                              if (checkSelfPermission(Manifest.permission.CALL_PHONE) == PackageManager.PERMISSION_GRANTED) {
                                  startActivity(new Intent(Intent.ACTION_CALL, uri));
                              } else {
                                  requestPermissions(new String[]{Manifest.permission.CALL_PHONE}, 101);
                                  startActivity(new Intent(Intent.ACTION_DIAL, uri));
                              }
                          } catch (Exception ignored) {}
                      });
                  }

                  @JavascriptInterface
                  public void toggleFlash(boolean state) {
                      try {
                          CameraManager cm = (CameraManager) getSystemService(Context.CAMERA_SERVICE);
                          String camId = cm.getCameraIdList()[0];
                          cm.setTorchMode(camId, state);
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public void lockPhone() {
                      runOnUiThread(() -> {
                          try {
                              DevicePolicyManager dpm = (DevicePolicyManager) getSystemService(Context.DEVICE_POLICY_SERVICE);
                              ComponentName admin = new ComponentName(MainActivity.this, JarvisAdminReceiver.class);
                              if (dpm.isAdminActive(admin)) {
                                  dpm.lockNow();
                              } else {
                                  Intent intent = new Intent(DevicePolicyManager.ACTION_ADD_DEVICE_ADMIN);
                                  intent.putExtra(DevicePolicyManager.EXTRA_DEVICE_ADMIN, admin);
                                  intent.putExtra(DevicePolicyManager.EXTRA_ADD_EXPLANATION, "Allow Jarvis to lock your phone screen on command.");
                                  startActivity(intent);
                              }
                          } catch (Exception ignored) {}
                      });
                  }

                  @JavascriptInterface
                  public void controlVolume(String dir) {
                      try {
                          AudioManager am = (AudioManager) getSystemService(Context.AUDIO_SERVICE);
                          if ("up".equals(dir)) {
                              am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_RAISE, AudioManager.FLAG_SHOW_UI);
                          } else if ("down".equals(dir)) {
                              am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_LOWER, AudioManager.FLAG_SHOW_UI);
                          } else if ("mute".equals(dir)) {
                              am.adjustStreamVolume(AudioManager.STREAM_MUSIC, AudioManager.ADJUST_MUTE, AudioManager.FLAG_SHOW_UI);
                          } else if ("max".equals(dir)) {
                              int max = am.getStreamMaxVolume(AudioManager.STREAM_MUSIC);
                              am.setStreamVolume(AudioManager.STREAM_MUSIC, max, AudioManager.FLAG_SHOW_UI);
                          }
                      } catch (Exception ignored) {}
                  }

                  @JavascriptInterface
                  public void setAlarm(int hour, int minute) {
                      runOnUiThread(() -> {
                          try {
                              Intent i = new Intent(AlarmClock.ACTION_SET_ALARM);
                              i.putExtra(AlarmClock.EXTRA_HOUR, hour);
                              i.putExtra(AlarmClock.EXTRA_MINUTES, minute);
                              i.putExtra(AlarmClock.EXTRA_MESSAGE, "Jarvis Alarm");
                              i.putExtra(AlarmClock.EXTRA_SKIP_UI, false);
                              startActivity(i);
                          } catch (Exception ignored) {}
                      });
                  }

                  @JavascriptInterface
                  public boolean openAnyApp(String query) {
                      try {
                          String q = query.toLowerCase().trim();
                          if (q.contains("wifi") || q.contains("wi-fi")) {
                              startActivity(new Intent(Settings.ACTION_WIFI_SETTINGS));
                              return true;
                          }
                          if (q.contains("bluetooth")) {
                              startActivity(new Intent(Settings.ACTION_BLUETOOTH_SETTINGS));
                              return true;
                          }
                          if (q.equals("settings")) {
                              startActivity(new Intent(Settings.ACTION_SETTINGS));
                              return true;
                          }
                          PackageManager pm = getPackageManager();
                          Intent mainIntent = new Intent(Intent.ACTION_MAIN, null);
                          mainIntent.addCategory(Intent.CATEGORY_LAUNCHER);
                          List<ResolveInfo> apps = pm.queryIntentActivities(mainIntent, 0);
                          for (ResolveInfo info : apps) {
                              String label = info.loadLabel(pm).toString().toLowerCase();
                              String pkg = info.activityInfo.packageName.toLowerCase();
                              if (label.contains(q) || q.contains(label) || pkg.contains(q)) {
                                  Intent launch = pm.getLaunchIntentForPackage(info.activityInfo.packageName);
                                  if (launch != null) {
                                      startActivity(launch);
                                      return true;
                                  }
                              }
                          }
                      } catch (Exception ignored) {}
                      return false;
                  }
              }

              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode == REQ_SPEECH) {
                      if (resultCode == RESULT_OK && data != null) {
                          ArrayList<String> matches = data.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS);
                          if (matches != null && !matches.isEmpty()) {
                              String spoken = matches.get(0);
                              webView.evaluateJavascript("window.onNativeSpeechResult(" + JSONObject.quote(spoken) + ");", null);
                              return;
                          }
                      }
                      webView.evaluateJavascript("window.onNativeSpeechResult('');", null);
                  }
              }
          }
          EOF

      - name: Compile and Sign Jarvis APK
        run: |
          cd build_apk
          BUILD_TOOLS=$(ls -1 $ANDROID_HOME/build-tools | sort -V | tail -n 1)
          PLATFORM=$(ls -1 $ANDROID_HOME/platforms | sort -V | tail -n 1)
          AAPT="$ANDROID_HOME/build-tools/$BUILD_TOOLS/aapt"
          D8="$ANDROID_HOME/build-tools/$BUILD_TOOLS/d8"
          ZIPALIGN="$ANDROID_HOME/build-tools/$BUILD_TOOLS/zipalign"
          APKSIGNER="$ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner"
          ANDROID_JAR="$ANDROID_HOME/platforms/$PLATFORM/android.jar"

          $AAPT package -f -m -J src -M AndroidManifest.xml -S res -I "$ANDROID_JAR"
          javac -source 11 -target 11 -classpath "$ANDROID_JAR" -d obj src/com/shahalam/jarvis/*.java
          $D8 --lib "$ANDROID_JAR" --output . obj/com/shahalam/jarvis/*.class
          $AAPT package -f -M AndroidManifest.xml -S res -A assets -I "$ANDROID_JAR" -F unaligned.apk
          zip -uj unaligned.apk classes.dex
          $ZIPALIGN -f 4 unaligned.apk aligned.apk

          keytool -genkeypair -v -keystore jarvis.keystore -alias jarvis -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass 231123 -keypass 231123 -dname "CN=Shahalam Laskar, OU=AI, O=Shahalam, L=Assam, ST=AS, C=IN"

          $APKSIGNER sign --ks jarvis.keystore --ks-pass pass:231123 --key-pass pass:231123 --out ../Jarvis.apk aligned.apk
          cp ../Jarvis.apk ../JARVIS-shahalam-laskar.apk

      - name: Publish Jarvis APK to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0-jarvis
          name: "Jarvis v3.0 Android APK (by Shahalam Laskar)"
          files: |
            Jarvis.apk
            JARVIS-shahalam-laskar.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
