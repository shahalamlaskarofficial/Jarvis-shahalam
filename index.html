<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Jarvis AI</title>
<style>
  :root {
    --bg: #020409;
    --panel: rgba(9, 18, 34, 0.84);
    --cyan: #00f0ff;
    --blue: #0066ff;
    --text: #e6f9ff;
    --muted: #6e8fa6;
    --danger: #ff3366;
    --success: #00ff9d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
  body {
    background: radial-gradient(circle at 50% 12%, #071b34 0%, var(--bg) 72%);
    color: var(--text);
    font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* HEADER */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 14px; border-bottom: 1px solid rgba(0, 240, 255, 0.15);
    background: rgba(2, 4, 9, 0.8);
  }
  .brand h1 { font-size: 1.18rem; font-weight: 800; color: var(--cyan); letter-spacing: 2.5px; }
  .brand span { font-size: 0.62rem; color: var(--muted); letter-spacing: 1px; display: block; }
  .top-controls { display: flex; gap: 6px; align-items: center; }
  .pill-btn {
    background: rgba(0, 240, 255, 0.08); border: 1px solid rgba(0, 240, 255, 0.28);
    color: var(--cyan); padding: 5px 9px; border-radius: 18px; font-size: 0.72rem; font-weight: 600; cursor: pointer;
  }
  .pill-btn:active { background: var(--cyan); color: #000; }

  /* LIVE TELEMETRY HUD BAR */
  .hud-bar {
    display: flex; justify-content: space-around; align-items: center;
    padding: 6px 12px; background: rgba(0, 240, 255, 0.04);
    border-bottom: 1px solid rgba(0, 240, 255, 0.1);
    font-size: 0.68rem; color: var(--muted); letter-spacing: 0.5px;
  }
  .hud-item b { color: var(--cyan); }

  /* FIXED ARC-REACTOR LOGO CORE */
  .core-section {
    display: flex; flex-direction: column; align-items: center; padding: 12px 16px 6px;
  }
  .orb-wrap {
    position: relative; width: 102px; height: 102px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .orb-ring {
    position: absolute; inset: -6px; border-radius: 50%;
    border: 2px dashed var(--cyan); animation: spin 14s linear infinite; opacity: 0.75;
  }
  .orb-ring-inner {
    position: absolute; inset: 2px; border-radius: 50%;
    border: 1.5px solid rgba(0, 240, 255, 0.4); animation: spinReverse 9s linear infinite;
  }
  body.paused .orb-ring, body.paused .orb-ring-inner { animation-play-state: paused; }
  .orb-wrap.listening .orb-ring {
    border-style: solid; border-color: var(--success);
    box-shadow: 0 0 25px var(--success); animation: pulse 0.9s infinite alternate;
  }
  .orb-logo {
    width: 88px; height: 88px; border-radius: 50%; overflow: hidden;
    border: 2px solid var(--cyan); box-shadow: 0 0 22px rgba(0, 240, 255, 0.35), inset 0 0 18px rgba(0, 240, 255, 0.25);
    background: radial-gradient(circle, #06223f 0%, #02060d 80%);
    display: flex; align-items: center; justify-content: center;
  }
  .status-line { font-size: 0.8rem; color: var(--cyan); margin-top: 8px; font-weight: 600; letter-spacing: 0.5px; }

  @keyframes spin { 100% { transform: rotate(360deg); } }
  @keyframes spinReverse { 100% { transform: rotate(-360deg); } }
